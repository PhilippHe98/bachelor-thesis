apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: java-app
  name: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: java-app
    spec:
      containers:
      - image: ghcr.io/philipphe98/bachelor-thesis/micronaut-crac:main
        name: micronaut-crac
        command:
        - java
        - -XX:CRaCRestoreFrom=/micronaut-checkpoint
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - SYS_PTRACE
            - CHECKPOINT_RESTORE
          privileged: false
        volumeMounts:
        - name: crac-storage
          mountPath: /micronaut-checkpoint
        env:
        - name: JAVA_OPTS
          value: "-XX:+UseParallelGC -XX:MaxRAMPercentage=75"
        - name: JDBC_URL
          value: jdbc:postgresql://mypostgresph.postgres.database.azure.com:5432/postgres?sslmode=require
        - name: JDBC_USER
          value: azureuser
        - name: JDBC_PASSWORD
          value: "#iM&rx]Fj3]Ah!g"
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
        resources:
          limits:
            memory: "1Gi"
          requests:
            memory: "1Gi"
      volumes:
      - name: crac-storage
        csi:
          driver: file.csi.azure.com
          volumeAttributes:
            secretName: azure-secret
            shareName: myfileshare
            mountOptions: 'dir_mode=0777,file_mode=0777,cache=strict,actimeo=30,nosharesock,nobrl'
      imagePullSecrets:
      - name: regcred
status: {}
---
apiVersion: v1
kind: Service
metadata:
  name: java-app-service
  labels:
    app: java-app
spec:
  type: LoadBalancer
  selector:
    app: java-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
